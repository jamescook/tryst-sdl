name: tryst-sdl
version: 0.1.0

authors:
  - James Cook

crystal: ">= 1.21.0"

license: MIT

description: |
  GPU-accelerated SDL3 rendering, audio and gamepad input for tryst (Tk).

# A git dependency on the tryst repo (github.com/jamescook/tryst), now
# that tryst-sdl lives in its own repo rather than beside tryst in a
# monorepo. The dependency only points one way: tryst knows nothing
# about SDL, and nothing here is reachable from a plain `require "tryst"`.
dependencies:
  tryst:
    github: jamescook/tryst

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    tag: v1.7.0-dev

# Informational (shards does not install these), but it is the one place
# a consumer can find out what has to exist on the box before this shard
# will link. Package names differ per platform: apt wants libsdl3-dev,
# libsdl3-mixer-dev, libsdl3-image-dev, libsdl3-ttf-dev; Homebrew wants
# sdl3, sdl3_mixer, sdl3_image, sdl3_ttf. pkg-config, which is what the
# build actually asks, calls them sdl3, sdl3-mixer, sdl3-image, sdl3-ttf.
libraries:
  libSDL3: ">= 3.2.0"
  libSDL3_mixer: ">= 3.2.0"
  libSDL3_image: ">= 3.2.0"
  libSDL3_ttf: ">= 3.2.0"
